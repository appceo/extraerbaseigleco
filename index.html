<!-- Lógica de Aplicación -->
    <script>
        // Inicializar Iconos
        lucide.createIcons();

        const fileInput = document.getElementById('excelFile');
        const dropZone = document.getElementById('dropZone');
        const fileLabel = document.getElementById('fileLabel');
        const grupoSelect = document.getElementById('grupoSelect');
        const processBtn = document.getElementById('processBtn');
        const statusCard = document.getElementById('statusCard');
        const logArea = document.getElementById('logArea');
        const badgeCount = document.getElementById('badgeCount');

        let rawExcelData = [];

        // Manejadores de Eventos para Carga de Archivos
        fileInput.addEventListener('change', handleFileSelect);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            fileLabel.innerHTML = `<span class="text-emerald-400 font-semibold">${file.name}</span> (${(file.size / 1024).toFixed(1)} KB)`;
            
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // raw: false e es: true ayudan a normalizar la lectura de fechas y strings en CSV y Excel
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    // Convertir la hoja a matriz 2D de filas
                    rawExcelData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                    if (rawExcelData.length > 1) {
                        processBtn.disabled = false;
                        showStatus();
                        log(`✅ Archivo cargado correctamente: ${rawExcelData.length - 1} filas encontradas.`, "emerald");
                    } else {
                        alert("El archivo subido no contiene registros válidos.");
                    }
                } catch (err) {
                    alert("Error al leer el archivo Excel: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Función para normalizar texto (quitar tildes, espacios extras y convertir a mayúsculas)
        function cleanString(str) {
            return String(str || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        processBtn.addEventListener('click', () => {
            if (rawExcelData.length < 2) return;

            const selectedOption = grupoSelect.value;
            showStatus();
            logArea.innerHTML = "";
            log(`🚀 Iniciando extracción para opción: [${selectedOption}]...`, "indigo");

            // 1. Obtener los encabezados originales (Fila 0)
            const originalHeaders = rawExcelData[0].map(h => cleanString(h));

            // Identificar dinámicamente el índice de las columnas clave
            let colGrupoIndex = originalHeaders.findIndex(h => h.includes("GRUPO") || h.includes("PERTENECE"));
            let colFechaIndex = originalHeaders.findIndex(h => h.includes("FECHA") && h.includes("CREAC"));

            // Si no las encuentra por nombre, recaer sobre los índices por defecto (9 y 10)
            if (colGrupoIndex === -1) colGrupoIndex = 9;
            if (colFechaIndex === -1) colFechaIndex = 10;

            log(`ℹ️ Usando columna [${colGrupoIndex + 1}] para Filtro de Grupo y [${colFechaIndex + 1}] para Fecha de Creación.`, "slate");

            // 2. Estructura de encabezados de salida
            const finalHeaders = [
                "Identificación",
                "Edad",
                "Primer Nombre",
                "Segundo Nombre",
                "Primer Apellido",
                "Segundo Apellido",
                "Estado Civil",
                "Teléfono Móvil",
                "E-mail",
                "Grupo al que pertenece",
                "Fecha Creación",
                "Sede",
                "Cita con Dios",
                "EnForma",
                "1. Contacto Inicial",
                "Fecha contacto",
                "detalle contacto",
                "2. Asignado a CFV",
                "Fecha Asignación CFV",
                "detalle Asignación CFV",
                "3. Registro Café",
                "Fecha Cafe",
                "detalle Cafe",
                "4. Conexión Efectiva",
                "Fecha Conexión",
                "detalle Conexión"
            ];

            // 3. Filtrar registros según selección
            const dataRows = rawExcelData.slice(1);
            let filteredRows = [];

            const cleanTarget = cleanString(selectedOption);

            dataRows.forEach((row) => {
                const rawVal = row[colGrupoIndex];
                const grupoVal = cleanString(rawVal);
                
                let matches = false;

                if (cleanTarget === "VACIO") {
                    matches = (grupoVal === "" || grupoVal === "SIN INFORMACION" || grupoVal === "NULL" || grupoVal === "UNDEFINED");
                } else {
                    // Coincidencia flexible por inclusión o inicio
                    matches = grupoVal.includes(cleanTarget);
                }

                if (matches) {
                    const newRow = [];
                    for (let c = 0; c < 26; c++) {
                        newRow.push(row[c] !== undefined ? row[c] : "");
                    }
                    filteredRows.push(newRow);
                }
            });

            log(`🔍 Registros encontrados que coinciden con [${selectedOption}]: ${filteredRows.length}`, "sky");

            if (filteredRows.length === 0) {
                log(`⚠️ No se encontraron registros para la opción seleccionada. Verifica que el archivo contenga valores válidos.`, "amber");
                badgeCount.classList.remove('hidden');
                badgeCount.innerText = "0 Registros";
                return;
            }

            // 4. Ordenamiento Multinivel
            log(`🔃 Aplicando ordenamiento multinivel...`, "purple");

            filteredRows.sort((a, b) => {
                const grupoA = cleanString(a[colGrupoIndex]);
                const grupoB = cleanString(b[colGrupoIndex]);

                if (grupoA < grupoB) return -1;
                if (grupoA > grupoB) return 1;

                const fechaA = parseFecha(a[colFechaIndex]);
                const fechaB = parseFecha(b[colFechaIndex]);

                return fechaB - fechaA;
            });

            // 5. Construcción del nuevo archivo Excel
            log(`📊 Generando archivo Excel...`, "emerald");

            const finalData = [finalHeaders, ...filteredRows];
            const newWorksheet = XLSX.utils.aoa_to_sheet(finalData);

            const colWidths = finalHeaders.map(h => ({ wch: Math.max(h.length + 3, 15) }));
            newWorksheet['!cols'] = colWidths;

            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Reporte Filtrado");

            const fileName = `Reporte_Igleco_${selectedOption.replace(/\s+/g, '_')}_${formatDate(new Date())}.xlsx`;
            XLSX.writeFile(newWorkbook, fileName);

            log(`🎉 Archivo descargado exitosamente: ${fileName}`, "emerald");
            
            badgeCount.classList.remove('hidden');
            badgeCount.innerText = `${filteredRows.length} Registros Exportados`;
        });

        function parseFecha(val) {
            if (!val) return new Date(0);
            if (val instanceof Date) return val;
            
            if (typeof val === 'number') {
                return new Date((val - (25567 + 2)) * 86400 * 1000);
            }

            const str = String(val).trim();
            const parsed = Date.parse(str);
            if (!isNaN(parsed)) return new Date(parsed);

            return new Date(0);
        }

        function formatDate(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
        }

        function showStatus() {
            statusCard.classList.remove('hidden');
        }

        function log(msg, color = "slate") {
            const colors = {
                slate: "text-slate-400",
                indigo: "text-indigo-400",
                emerald: "text-emerald-400",
                sky: "text-sky-400",
                amber: "text-amber-400",
                purple: "text-purple-400"
            };

            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = `${colors[color] || colors.slate} flex items-start gap-2`;
            logItem.innerHTML = `<span class="text-slate-600">[${time}]</span> <span>${msg}</span>`;
            logArea.appendChild(logItem);
            logArea.scrollTop = logArea.scrollHeight;
        }
    </script>

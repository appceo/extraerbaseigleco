<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor y Procesador de Datos - Igleco</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) para procesamiento de Excel y CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                    <i data-lucide="filter" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Procesador de Base Igleco</h1>
                    <p class="text-xs text-slate-400">Extracción selectiva de miembros por grupo de asistencia</p>
                </div>
            </div>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> v3.1 Corregido
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-6 py-10 flex-grow w-full">
        
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="space-y-6">
                
                <!-- 1. Carga de Archivo -->
                <div>
                    <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-indigo-400"></i>
                        1. Adjuntar tabla de datos origen (Excel o CSV)
                    </label>
                    <div class="relative">
                        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" />
                        <div id="dropZone" class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-800/50 hover:bg-slate-700/30 rounded-xl cursor-pointer transition-all group">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4 pointer-events-none">
                                <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 group-hover:text-indigo-400 mb-2 transition-colors"></i>
                                <p id="fileLabel" class="text-sm text-slate-300 font-medium">Haz clic o arrastra tu archivo <span class="font-semibold text-indigo-400">.xlsx / .xls / .csv</span></p>
                                <p class="text-xs text-slate-500 mt-1">Soporta la estructura oficial de 37 campos de Igleco</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Menú Desplegable de Categorías -->
                <div>
                    <label for="grupoSelect" class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i>
                        2. Seleccionar Grupo a Extraer
                    </label>
                    <div class="relative">
                        <select id="grupoSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3.5 pr-10 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block appearance-none cursor-pointer transition-all">
                            <option value="ASIGNAR">ASIGNAR (Grupo inicia con "ASIGNAR")</option>
                            <option value="CAFE">CAFE (Grupo inicia con "CAFE")</option>
                            <option value="CASOS ESPECIALES">CASOS ESPECIALES (Grupo inicia con "CASOS")</option>
                            <option value="NUEVOS PARA CONECTAR">NUEVOS PARA CONECTAR (Grupo inicia con "NUEVOS")</option>
                            <option value="REUBICAR CFV">REUBICAR CFV (Grupo inicia con "REUBICAR")</option>
                            <option value="VACIO">VACIO (Sin grupo asignado)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- Botón de Procesamiento -->
                <button id="processBtn" disabled class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:from-slate-700 disabled:to-slate-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/20 disabled:shadow-none transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    Filtrar y Exportar a Excel
                </button>

            </div>
        </div>

        <!-- Panel de Estado -->
        <div id="statusCard" class="hidden mt-8 bg-slate-800 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i data-lucide="terminal" class="w-4 h-4 text-indigo-400"></i>
                    Consola de Procesamiento
                </h3>
                <span id="badgeCount" class="hidden px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
            </div>

            <div id="logArea" class="bg-slate-950/80 border border-slate-800 text-xs font-mono text-slate-300 p-4 rounded-xl h-48 overflow-y-auto space-y-1.5 leading-relaxed"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Plataforma de Extracción de Datos · Igleco 2026
    </footer>

    <script>
        lucide.createIcons();

        const fileInput = document.getElementById('excelFile');
        const dropZone = document.getElementById('dropZone');
        const fileLabel = document.getElementById('fileLabel');
        const grupoSelect = document.getElementById('grupoSelect');
        const processBtn = document.getElementById('processBtn');
        const statusCard = document.getElementById('statusCard');
        const logArea = document.getElementById('logArea');
        const badgeCount = document.getElementById('badgeCount');

        let rawData = [];

        // Activar selector al hacer clic en la zona
        dropZone.addEventListener('click', () => {
            fileInput.value = ''; // Resetear valor para permitir seleccionar el mismo archivo
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        function cleanString(str) {
            return String(str || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        function processFile(file) {
            showStatus();
            logArea.innerHTML = "";
            log(`📁 Leyendo archivo: ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`, "indigo");

            fileLabel.innerHTML = `<span class="text-emerald-400 font-semibold">${file.name}</span> (${(file.size / 1024).toFixed(1)} KB)`;

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // SheetJS autodetecta delimitadores CSV y formatos Excel en modo arraybuffer
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                    if (rawData.length > 1) {
                        processBtn.disabled = false;
                        log(`✅ Archivo procesado con éxito: ${rawData.length - 1} filas cargadas.`, "emerald");
                        log(`📌 Columnas detectadas: ${rawData[0].length}`, "sky");
                    } else {
                        log(`❌ El archivo no contiene registros suficientes.`, "amber");
                        processBtn.disabled = true;
                    }
                } catch (err) {
                    log(`❌ Error al procesar la estructura del archivo: ${err.message}`, "amber");
                    processBtn.disabled = true;
                }
            };

            reader.onerror = function () {
                log(`❌ Error al leer el archivo desde el navegador.`, "amber");
                processBtn.disabled = true;
            };

            reader.readAsArrayBuffer(file);
        }

        processBtn.addEventListener('click', () => {
            if (rawData.length < 2) return;

            const selectedOption = grupoSelect.value;
            log(`🚀 Iniciando extracción para: [${selectedOption}]...`, "indigo");

            const headers = rawData[0];
            const cleanHeaders = headers.map(h => cleanString(h));

            // Identificar columna objetivo
            let colGrupoIndex = cleanHeaders.findIndex(h => 
                h.includes("GRUPO") || h.includes("PERTENECE") || h.includes("ASISTE")
            );

            if (colGrupoIndex === -1) colGrupoIndex = 11; // Índice por defecto

            log(`ℹ️ Evaluando filtro en la columna: "${headers[colGrupoIndex] || 'Columna ' + (colGrupoIndex + 1)}"`, "slate");

            const prefixMap = {
                "ASIGNAR": "ASIGNAR",
                "CAFE": "CAFE",
                "CASOS ESPECIALES": "CASOS",
                "NUEVOS PARA CONECTAR": "NUEVOS",
                "REUBICAR CFV": "REUBICAR"
            };

            const targetPrefix = prefixMap[selectedOption] || "";
            const dataRows = rawData.slice(1);
            let filteredRows = [];

            dataRows.forEach((row) => {
                const rawVal = row[colGrupoIndex];
                const cleanVal = cleanString(rawVal);
                let matches = false;

                if (selectedOption === "VACIO") {
                    matches = (cleanVal === "" || cleanVal === "NULL" || cleanVal === "UNDEFINED" || cleanVal === "SIN INFORMACION");
                } else {
                    matches = cleanVal.startsWith(targetPrefix);
                }

                if (matches) {
                    filteredRows.push(row);
                }
            });

            log(`🔍 Registros coincidentes encontrados: ${filteredRows.length}`, "sky");

            if (filteredRows.length === 0) {
                log(`⚠️ No se encontraron coincidencias para la opción seleccionada.`, "amber");
                badgeCount.classList.remove('hidden');
                badgeCount.innerText = "0 Registros";
                return;
            }

            log(`📊 Exportando archivo Excel...`, "emerald");

            const exportData = [headers, ...filteredRows];
            const newWorksheet = XLSX.utils.aoa_to_sheet(exportData);

            const colWidths = headers.map(h => ({ wch: Math.max(String(h).length + 3, 14) }));
            newWorksheet['!cols'] = colWidths;

            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Igleco Filtrado");

            const safeName = selectedOption.replace(/\s+/g, '_');
            const fileName = `Igleco_${safeName}_${formatDate(new Date())}.xlsx`;
            XLSX.writeFile(newWorkbook, fileName);

            log(`🎉 Archivo generado y descargado: ${fileName}`, "emerald");
            badgeCount.classList.remove('hidden');
            badgeCount.innerText = `${filteredRows.length} Registros Exportados`;
        });

        function formatDate(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
        }

        function showStatus() {
            statusCard.classList.remove('hidden');
        }

        function log(msg, color = "slate") {
            const colors = {
                slate: "text-slate-400",
                indigo: "text-indigo-400",
                emerald: "text-emerald-400",
                sky: "text-sky-400",
                amber: "text-amber-400"
            };

            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = `${colors[color] || colors.slate} flex items-start gap-2`;
            logItem.innerHTML = `<span class="text-slate-600">[${time}]</span> <span>${msg}</span>`;
            logArea.appendChild(logItem);
            logArea.scrollTop = logArea.scrollHeight;
        }
    </script>
</body>
</html>

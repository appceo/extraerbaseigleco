    <script>
        // Inicializar Iconos
        lucide.createIcons();

        const fileInput = document.getElementById('excelFile');
        const dropZone = document.getElementById('dropZone');
        const fileLabel = document.getElementById('fileLabel');
        const grupoSelect = document.getElementById('grupoSelect');
        const processBtn = document.getElementById('processBtn');
        const statusCard = document.getElementById('statusCard');
        const logArea = document.getElementById('logArea');
        const badgeCount = document.getElementById('badgeCount');

        let rawExcelData = [];

        // Manejadores de Eventos para Carga de Archivos
        fileInput.addEventListener('change', handleFileSelect);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        function cleanString(str) {
            return String(str || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            fileLabel.innerHTML = `<span class="text-emerald-400 font-semibold">${file.name}</span> (${(file.size / 1024).toFixed(1)} KB)`;
            
            const reader = new FileReader();

            // Si es CSV, lo leemos como texto para manejar delimitadores (;, \t, ,)
            if (file.name.endsWith('.csv')) {
                reader.onload = function (e) {
                    try {
                        const content = e.target.result;
                        rawExcelData = parseCSVContent(content);

                        if (rawExcelData.length > 1) {
                            processBtn.disabled = false;
                            showStatus();
                            logArea.innerHTML = "";
                            log(`✅ Archivo CSV cargado: ${rawExcelData.length - 1} filas detectadas.`, "emerald");
                            log(`📌 Columnas detectadas (${rawExcelData[0].length}): ${rawExcelData[0].slice(0, 5).join(' | ')}...`, "sky");
                        } else {
                            alert("El archivo CSV no contiene suficiente información.");
                        }
                    } catch (err) {
                        alert("Error al procesar CSV: " + err.message);
                    }
                };
                reader.readAsText(file, "UTF-8");
            } else {
                // Si es .xlsx o .xls
                reader.onload = function (e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];

                        rawExcelData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                        if (rawExcelData.length > 1) {
                            processBtn.disabled = false;
                            showStatus();
                            logArea.innerHTML = "";
                            log(`✅ Archivo Excel cargado: ${rawExcelData.length - 1} filas encontradas.`, "emerald");
                            log(`📌 Columnas detectadas (${rawExcelData[0].length}): ${rawExcelData[0].slice(0, 5).join(' | ')}...`, "sky");
                        } else {
                            alert("El archivo subido no contiene registros válidos.");
                        }
                    } catch (err) {
                        alert("Error al leer el archivo Excel: " + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        }

        // Parser manual de CSV robusto para detectar comas, punto y coma o tabulaciones
        function parseCSVContent(text) {
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== "");
            if (lines.length === 0) return [];

            // Detectar delimitador de la primera línea
            const sampleLine = lines[0];
            let delimiter = ",";
            if ((sampleLine.match(/;/g) || []).length > (sampleLine.match(/,/g) || []).length) {
                delimiter = ";";
            } else if ((sampleLine.match(/\t/g) || []).length > (sampleLine.match(/,/g) || []).length) {
                delimiter = "\t";
            }

            return lines.map(line => {
                // Split básico respetando comillas simples/dobles
                const regex = new RegExp(`(?:^|${delimiter})(?:"([^"]*)"|([^"${delimiter}]*))`, "g");
                const row = [];
                let matches;
                while ((matches = regex.exec(line)) !== null) {
                    let val = matches[1] !== undefined ? matches[1] : matches[2];
                    row.push(val !== undefined ? val.trim() : "");
                }
                return row;
            });
        }

        processBtn.addEventListener('click', () => {
            if (rawExcelData.length < 2) return;

            const selectedOption = grupoSelect.value;
            showStatus();
            logArea.innerHTML = "";
            log(`🚀 Iniciando extracción para opción: [${selectedOption}]...`, "indigo");

            const originalHeaders = rawExcelData[0].map(h => cleanString(h));

            // Intentar buscar la columna por nombre
            let colGrupoIndex = originalHeaders.findIndex(h => h.includes("GRUPO") || h.includes("PERTENECE") || h.includes("ESTADO") || h.includes("CATEGORIA"));
            let colFechaIndex = originalHeaders.findIndex(h => h.includes("FECHA") && h.includes("CREAC"));

            if (colGrupoIndex === -1) colGrupoIndex = 9;
            if (colFechaIndex === -1) colFechaIndex = 10;

            const finalHeaders = [
                "Identificación",
                "Edad",
                "Primer Nombre",
                "Segundo Nombre",
                "Primer Apellido",
                "Segundo Apellido",
                "Estado Civil",
                "Teléfono Móvil",
                "E-mail",
                "Grupo al que pertenece",
                "Fecha Creación",
                "Sede",
                "Cita con Dios",
                "EnForma",
                "1. Contacto Inicial",
                "Fecha contacto",
                "detalle contacto",
                "2. Asignado a CFV",
                "Fecha Asignación CFV",
                "detalle Asignación CFV",
                "3. Registro Café",
                "Fecha Cafe",
                "detalle Cafe",
                "4. Conexión Efectiva",
                "Fecha Conexión",
                "detalle Conexión"
            ];

            const dataRows = rawExcelData.slice(1);
            let filteredRows = [];
            const cleanTarget = cleanString(selectedOption);

            dataRows.forEach((row) => {
                let matches = false;

                // 1. Probar en la columna identificada
                const cellVal = cleanString(row[colGrupoIndex]);

                if (cleanTarget === "VACIO") {
                    matches = (cellVal === "" || cellVal === "SIN INFORMACION" || cellVal === "NULL" || cellVal === "UNDEFINED");
                } else {
                    matches = cellVal.includes(cleanTarget);
                }

                // 2. Búsqueda de respaldo: Si no hizo match en la columna 9/específica, escanear TODA la fila
                if (!matches && cleanTarget !== "VACIO") {
                    const fullRowText = row.map(c => cleanString(c)).join(" ");
                    if (fullRowText.includes(cleanTarget)) {
                        matches = true;
                    }
                }

                if (matches) {
                    const newRow = [];
                    for (let c = 0; c < 26; c++) {
                        newRow.push(row[c] !== undefined ? row[c] : "");
                    }
                    filteredRows.push(newRow);
                }
            });

            log(`🔍 Registros encontrados que coinciden con [${selectedOption}]: ${filteredRows.length}`, "sky");

            if (filteredRows.length === 0) {
                log(`⚠️ No se encontraron registros. Revisa si el archivo realmente contiene el término '${selectedOption}'.`, "amber");
                badgeCount.classList.remove('hidden');
                badgeCount.innerText = "0 Registros";
                return;
            }

            // Ordenamiento Multinivel
            log(`🔃 Aplicando ordenamiento...`, "purple");

            filteredRows.sort((a, b) => {
                const grupoA = cleanString(a[colGrupoIndex]);
                const grupoB = cleanString(b[colGrupoIndex]);

                if (grupoA < grupoB) return -1;
                if (grupoA > grupoB) return 1;

                const fechaA = parseFecha(a[colFechaIndex]);
                const fechaB = parseFecha(b[colFechaIndex]);

                return fechaB - fechaA;
            });

            // Generar Excel
            log(`📊 Generando archivo Excel...`, "emerald");

            const finalData = [finalHeaders, ...filteredRows];
            const newWorksheet = XLSX.utils.aoa_to_sheet(finalData);

            const colWidths = finalHeaders.map(h => ({ wch: Math.max(h.length + 3, 15) }));
            newWorksheet['!cols'] = colWidths;

            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Reporte Filtrado");

            const fileName = `Reporte_Igleco_${selectedOption.replace(/\s+/g, '_')}_${formatDate(new Date())}.xlsx`;
            XLSX.writeFile(newWorkbook, fileName);

            log(`🎉 Archivo descargado exitosamente: ${fileName}`, "emerald");
            
            badgeCount.classList.remove('hidden');
            badgeCount.innerText = `${filteredRows.length} Registros Exportados`;
        });

        function parseFecha(val) {
            if (!val) return new Date(0);
            if (val instanceof Date) return val;
            
            if (typeof val === 'number') {
                return new Date((val - (25567 + 2)) * 86400 * 1000);
            }

            const str = String(val).trim();
            const parsed = Date.parse(str);
            if (!isNaN(parsed)) return new Date(parsed);

            return new Date(0);
        }

        function formatDate(d) {
            const pad = (n) => String(n).

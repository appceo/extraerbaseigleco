<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor y Procesador de Datos - Igleco</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) para procesamiento de Excel y CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                    <i data-lucide="filter" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Procesador de Base Igleco</h1>
                    <p class="text-xs text-slate-400">Extracción selectiva de miembros por grupo de asistencia</p>
                </div>
            </div>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> v3.0 GitHub Ready
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-6 py-10 flex-grow w-full">
        
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="space-y-6">
                
                <!-- 1. Carga de Archivo -->
                <div>
                    <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-indigo-400"></i>
                        1. Adjuntar tabla de datos origen (Excel o CSV)
                    </label>
                    <div class="relative">
                        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" />
                        <label for="excelFile" id="dropZone" class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-800/50 hover:bg-slate-700/30 rounded-xl cursor-pointer transition-all group">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                                <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 group-hover:text-indigo-400 mb-2 transition-colors"></i>
                                <p id="fileLabel" class="text-sm text-slate-300 font-medium">Haz clic o arrastra tu archivo <span class="font-semibold text-indigo-400">.xlsx / .xls / .csv</span></p>
                                <p class="text-xs text-slate-500 mt-1">Soporta la estructura oficial de 37 campos de Igleco</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 2. Menú Desplegable de Categorías -->
                <div>
                    <label for="grupoSelect" class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i>
                        2. Seleccionar Grupo a Extraer
                    </label>
                    <div class="relative">
                        <select id="grupoSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3.5 pr-10 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block appearance-none cursor-pointer transition-all">
                            <option value="ASIGNAR">ASIGNAR (Grupo inicia con "ASIGNAR")</option>
                            <option value="CAFE">CAFE (Grupo inicia con "CAFE")</option>
                            <option value="CASOS ESPECIALES">CASOS ESPECIALES (Grupo inicia con "CASOS")</option>
                            <option value="NUEVOS PARA CONECTAR">NUEVOS PARA CONECTAR (Grupo inicia con "NUEVOS")</option>
                            <option value="REUBICAR CFV">REUBICAR CFV (Grupo inicia con "REUBICAR")</option>
                            <option value="VACIO">VACIO (Sin grupo asignado)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- Botón de Procesamiento -->
                <button id="processBtn" disabled class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:from-slate-700 disabled:to-slate-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/20 disabled:shadow-none transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    Filtrar y Exportar a Excel
                </button>

            </div>
        </div>

        <!-- Panel de Estado -->
        <div id="statusCard" class="hidden mt-8 bg-slate-800 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-semibold text-white flex items-center gap-2">
                    <i data-lucide="terminal" class="w-4 h-4 text-indigo-400"></i>
                    Consola de Procesamiento
                </h3>
                <span id="badgeCount" class="hidden px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
            </div>

            <div id="logArea" class="bg-slate-950/80 border border-slate-800 text-xs font-mono text-slate-300 p-4 rounded-xl h-48 overflow-y-auto space-y-1.5 leading-relaxed"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Plataforma de Extracción de Datos · Igleco 2026
    </footer>

    <script>
        lucide.createIcons();

        const fileInput = document.getElementById('excelFile');
        const dropZone = document.getElementById('dropZone');
        const fileLabel = document.getElementById('fileLabel');
        const grupoSelect = document.getElementById('grupoSelect');
        const processBtn = document.getElementById('processBtn');
        const statusCard = document.getElementById('statusCard');
        const logArea = document.getElementById('logArea');
        const badgeCount = document.getElementById('badgeCount');

        let rawData = [];

        fileInput.addEventListener('change', handleFileSelect);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-700/40');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        function cleanString(str) {
            return String(str || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            fileLabel.innerHTML = `<span class="text-emerald-400 font-semibold">${file.name}</span> (${(file.size / 1024).toFixed(1)} KB)`;

            const reader = new FileReader();

            if (file.name.endsWith('.csv')) {
                reader.onload = function (e) {
                    try {
                        const content = e.target.result;
                        rawData = parseCSVContent(content);
                        validateAndEnable();
                    } catch (err) {
                        alert("Error al leer el archivo CSV: " + err.message);
                    }
                };
                reader.readAsText(file, "UTF-8");
            } else {
